<div tuiAppearance="floating" tuiCardLarge>
  <table
    tuiTable
    class="table"
  >
    <thead>
    <tr tuiThGroup>
      <th tuiTh [resizable]="true">Код товара</th>
      <th tuiTh [resizable]="true">Описание</th>
      <th tuiTh [resizable]="true">Коэф.сходимости</th>
      <th tuiTh [resizable]="true">Клиент</th>
      <th tuiTh [resizable]="true">Спецификация</th>
    </tr>
    </thead>
    <tbody tuiTbody>
      @for (item of userSearchResponse().items; track $index) {
        <tr tuiTr>
          <td tuiTd>
            {{ item.code }}
          </td>
          <td tuiTd>
            {{ item.text }}
          </td>
          <td tuiTd>
            {{ item.score }}
          </td>
          <td tuiTd>
            {{ item.meta.client }}
          </td>
          <td tuiTd>
            {{ item.meta.specification }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
