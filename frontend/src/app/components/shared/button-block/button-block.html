<div class="button-block">
  <button
    appearance="primary"
    tuiButton
    type="button"
    (click)="leftClicked.emit($event)"
  >
    {{ titles().left }}
  </button>

  <button
    appearance="accent"
    tuiButton
    type="button"
    (click)="rightClicked.emit($event)"
  >
    {{ titles().right }}
  </button>
</div>
