chat:
  prompt: |-
    Ответь на запрос, строго ссылаясь на предоставленный контекст, но не упоминая его:
    {context}
    
    Запрос:
    Какие коды у товаров со следующим описанием:
    {description}
    
    Твой ответ должен содержать только следующие данные: id товара из описания и код товара.
    Твой ответ должен быть строго валидным JSON и иметь следующую структуру:
    ```json
    {
      "answer": [
        {
          "id": 123,
          "code": "8420108000"
        }
      ]
    }
    ```
    Правила:
    Не добавляй никакого текста до и после JSON.
    Не используй markdown-обёртки типа json ... .
    Если ты не смог определить код товара опираясь на приведенный контекст,
    укажи `not found` в поле code.
    Если по всему запросу нет информации из контекста, верни: {"answer": []}
    
    Пример правильного ответа:
    {
      "answer": [
        {
          "id": 42,
          "code": "8420108000"
        }
      ]
    }