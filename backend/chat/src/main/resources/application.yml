spring:
  application:
    name: chat
  config:
    import: classpath:prompts/prompts.yml
  datasource:
    url: jdbc:postgresql://localhost:5434/chat
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  aws:
    s3:
      url: "http://localhost:9000"
      region: "us-east-2"
      bucket: "storage"
      credentials:
        access-key: "access-key"
        secret-key: "secret-key"
  ai:
    gigachat:
      scope: GIGACHAT_API_PERS
      client-id: ""
      client-secret: ""
      unsafe-ssl: true
      chat:
        options:
          model: GigaChat
          temperature: 0.5
          top-p: 0.5
          max-tokens: 2048

api-key-provider:
  enabled: true
  url: "http://localhost:8081/api/v1/api-key/validate"
  username: store
  password: ${AUTH_STORE_PASSWORD}
  scopes:
    - "store:all"

scheduler-thread-pool:
  thread-number: 3

store:
  url: "http://localhost:8080/api/v1"
  api-key: ${SERVICE_API_KEY}